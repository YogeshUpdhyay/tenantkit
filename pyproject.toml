[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenantkit"
version = "0.2.0"
description = "Framework-agnostic multi-tenancy and authentication"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "PyJWT[crypto]>=2.9,<3", "argon2-cffi>=23.1"]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0,<3"]
mongo = ["beanie>=2.0,<3"]
dev = ["beanie>=2.0,<3", "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "mypy>=1.13", "ruff>=0.8", "aiosqlite>=0.20", "asyncpg>=0.30", "alembic>=1.14", "fastapi>=0.115", "httpx>=0.27", "sqlalchemy[asyncio]>=2.0,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/tenantkit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/tenantkit"]
